<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body{
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        form{
            background: white;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
            width: 350px;
        }

        h1{
            text-align: center;
            color: #333;
            font-size: 26px;
            font-family: 'Georgia', serif;
            margin-bottom: 25px;
        }

        label{
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        /* Different label colors */
        .user-label{
            color: #ff5733;
            font-family: "Verdana", sans-serif;
        }

        .email-label{
            color: #007bff;
            font-family: "Trebuchet MS", sans-serif;
            font-style: italic;
        }

        .pass-label{
            color: #28a745;
            font-family: "Courier New", monospace;
            text-transform: uppercase;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #aaa;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus{
            border-color: #6a11cb;
            box-shadow: 0px 0px 8px rgba(106, 17, 203, 0.5);
        }

        button{
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #6a11cb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #2575fc;
            transform: scale(1.03);
        }
    </style>

</head>
<body>

    <form method="post">
        {% csrf_token %}
        <h1>Registration Form</h1>

        <label class="user-label">Username</label>
        <input type="text" name="username">

        <label class="email-label">Email</label>
        <input type="text" name="email">

        <label class="pass-label">Password</label>
        <input type="password" name="Password">

        <button type="submit">Submit</button>
    </form>
{{name}}
{{email}}
{{password}}
</body>
</html>
